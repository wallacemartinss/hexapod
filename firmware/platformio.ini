; Hexapod firmware.
;   pio run -e esp32dev          bench board (ESP32 DevKit, ESP-WROOM-32)
;   pio run -e esp32s3           robot board (ESP32-S3 SuperMini)
;   pio test -e native           unit tests on the PC, no hardware

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    nanopb/Nanopb@0.4.91
; Generates the nanopb code (buf) and injects the version from git.
extra_scripts = pre:scripts/pre_build.py

[esp32_common]
platform = platformio/espressif32@7.1.3
framework = arduino
extra_scripts =
    ${env.extra_scripts}
    post:scripts/merge_bin.py  ; `pio run -t merged`: one image at 0x0
monitor_speed = 115200
lib_deps =
    ${env.lib_deps}
    pololu/VL53L0X@1.3.1               ; has setAddress (4 sensors, one bus)
    adafruit/Adafruit BNO08x@1.2.5     ; SH-2 over I2C: game rotation vector
build_unflags =
    -std=gnu++11  ; Arduino 2.x default; the code (and the native tests) use C++17
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=0  ; ESP-IDF logs would corrupt the serial link
build_src_flags =
    -Wall
    -Wextra

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; The SuperMini (ESP32-S3 QFN56): 4 MB embedded flash (XMC) and 2 MB quad
; PSRAM, not the DevKitC-1's 8 MB. Its flash does not boot in QIO: the ROM
; loads the bootloader's first segment and resets (ets_loader.c 78).
board_build.flash_mode = dio
board_upload.flash_size = 4MB
board_build.partitions = default.csv

[env:native]
platform = native
test_framework = unity
; Only hardware-independent code runs on the PC.
test_build_src = yes
build_src_filter = -<*> +<link/> +<safety/> +<motion/> +<sensors/>
build_flags =
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
    -Werror
