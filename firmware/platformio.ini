; Hexapod firmware.
;   pio run -e esp32dev          bench board (ESP32 DevKit, ESP-WROOM-32)
;   pio run -e esp32s3           robot board (ESP32-S3 SuperMini)
;   pio test -e native           unit tests on the PC, no hardware

[platformio]
default_envs = esp32dev

[env]
lib_deps =
    nanopb/Nanopb@0.4.91
; Generates the nanopb code (buf) and injects the version from git.
extra_scripts = pre:scripts/pre_build.py

[esp32_common]
platform = platformio/espressif32@7.1.3
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=0  ; ESP-IDF logs would corrupt the serial link
build_src_flags =
    -Wall
    -Wextra

[env:esp32dev]
extends = esp32_common
board = esp32dev

[env:esp32s3]
extends = esp32_common
board = esp32-s3-devkitc-1
build_flags =
    ${esp32_common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
; TODO(hardware): confirm flash size and PSRAM of the SuperMini received.

[env:native]
platform = native
test_framework = unity
; Only hardware-independent code runs on the PC.
test_build_src = yes
build_src_filter = -<*> +<link/> +<safety/>
build_flags =
    -std=gnu++17
build_src_flags =
    -Wall
    -Wextra
    -Werror
