---
# Provision the hexapod Raspberry Pi (Phase 1.2). Idempotent: safe to re-run.
#   ansible-playbook site.yml            # apply
#   ansible-playbook site.yml --check    # dry run
- name: Provision hexapod Raspberry Pi
  hosts: hexapod
  become: true

  tasks:
    - name: Base packages
      ansible.builtin.import_tasks: tasks/base.yml
      tags: [base]

    - name: Boot configuration (camera, power savings)
      ansible.builtin.import_tasks: tasks/boot.yml
      tags: [boot]

    - name: Service user and deploy layout
      ansible.builtin.import_tasks: tasks/layout.yml
      tags: [layout]

    - name: ESP32 udev rule
      ansible.builtin.import_tasks: tasks/udev.yml
      tags: [udev]

    - name: Tailscale
      ansible.builtin.import_tasks: tasks/tailscale.yml
      tags: [tailscale]

    - name: MediaMTX
      ansible.builtin.import_tasks: tasks/mediamtx.yml
      tags: [mediamtx]

    - name: Systemd units
      ansible.builtin.import_tasks: tasks/services.yml
      tags: [services]

    - name: Hardware watchdog
      ansible.builtin.import_tasks: tasks/watchdog.yml
      tags: [watchdog]

  handlers:
    - name: Reload udev
      ansible.builtin.shell: udevadm control --reload && udevadm trigger --subsystem-match=tty
      changed_when: true

    - name: Reexec systemd
      ansible.builtin.systemd_service:
        daemon_reexec: true

    - name: Restart mediamtx
      ansible.builtin.systemd_service:
        name: mediamtx
        state: restarted
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Restart mic-stream
      ansible.builtin.systemd_service:
        name: mic-stream
        state: restarted
      ignore_errors: "{{ ansible_check_mode }}"

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 300
      when: provision_reboot | bool

    - name: Reboot pending
      ansible.builtin.debug:
        msg: "Boot config changed: reboot the Pi to apply (provision_reboot=false)."
      when: not provision_reboot | bool
