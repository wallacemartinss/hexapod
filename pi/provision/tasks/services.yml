---
- name: Firmware sync helper (flashes a board with no hexapod firmware)
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../deploy/firmware-sync.sh"
    dest: /usr/local/bin/hexapod-firmware-sync
    mode: "0755"

- name: Install systemd units
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../systemd/{{ item }}"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - hexd.service
    - hexapod-boot-screen.service
    - hexapod-firmware-sync.service
    - hexapod-wifi-unblock.service
    - mediamtx.service
    - mic-stream.service
  register: units

- name: Enable and start services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    state: "{{ omit if image_build | bool else 'started' }}"
    daemon_reload: "{{ units is changed and not image_build | bool }}"
  loop:
    - mediamtx
    - mic-stream
  # Depends on earlier steps that --check does not perform.
  ignore_errors: "{{ ansible_check_mode }}"

# Enabled only: they start once deploy.sh installs /opt/hexapod/current/bin/hexd
# (the boot screen then runs at every boot, before hexd).
- name: Enable hexd and its boot screen
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
    daemon_reload: "{{ units is changed and not image_build | bool }}"
  loop: [hexd, hexapod-boot-screen, hexapod-firmware-sync, hexapod-wifi-unblock]
  ignore_errors: "{{ ansible_check_mode }}"
