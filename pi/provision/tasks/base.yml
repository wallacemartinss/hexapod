---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Upgrade packages
  ansible.builtin.apt:
    upgrade: dist
  when: apt_upgrade | bool

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ base_packages }}"
    state: present

- name: Enable avahi (hexapod.local)
  ansible.builtin.systemd_service:
    name: avahi-daemon
    enabled: true
    state: started

# The app finds robots by this service (DNS-SD), then asks each one
# GET /identity to match the id read from the pairing QR.
- name: Announce the hexapod service on the network
  ansible.builtin.copy:
    dest: /etc/avahi/services/hexapod.service
    mode: "0644"
    content: |
      <?xml version="1.0" standalone='no'?>
      <!DOCTYPE service-group SYSTEM "avahi-service.dtd">
      <service-group>
        <name replace-wildcards="yes">%h</name>
        <service>
          <type>_hexapod._tcp</type>
          <port>{{ hexd_port }}</port>
          <txt-record>path=/identity</txt-record>
        </service>
      </service-group>

- name: Remove Debian esptool (no stub flasher)
  ansible.builtin.apt:
    name: esptool
    state: absent

- name: Install esptool from PyPI
  ansible.builtin.pip:
    name: "esptool=={{ esptool_version }}"
    virtualenv: /opt/esptool
    virtualenv_command: python3 -m venv

- name: Link esptool
  ansible.builtin.file:
    src: /opt/esptool/bin/esptool
    dest: /usr/local/bin/esptool
    state: link
    force: true
  ignore_errors: "{{ ansible_check_mode }}"
