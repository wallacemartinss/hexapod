---
- name: Service user
  ansible.builtin.user:
    name: "{{ hexapod_user }}"
    system: true
    create_home: false
    home: "{{ hexapod_root }}"
    shell: /usr/sbin/nologin
    groups: [dialout, video, audio]
    append: true

# /opt/hexapod/releases/<version>/, current -> releases/<version>, shared/{config,logs,firmware}
- name: Deploy directories
  ansible.builtin.file:
    path: "{{ hexapod_root }}/{{ item }}"
    state: directory
    owner: "{{ hexapod_user }}"
    group: "{{ hexapod_user }}"
    mode: "0755"
  loop:
    - ""
    - releases
    - shared
    - shared/config
    - shared/logs
    - shared/firmware

- name: Microphone device for mic-stream
  ansible.builtin.copy:
    dest: "{{ hexapod_root }}/shared/config/mic.env"
    content: "MIC_DEVICE={{ mic_alsa_device }}\n"
    owner: "{{ hexapod_user }}"
    group: "{{ hexapod_user }}"
    mode: "0644"
  notify: Restart mic-stream

# Copied only once: edits made on the Pi survive re-provisioning.
- name: hexd configuration
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../hexd/hexd.yaml"
    dest: "{{ hexapod_root }}/shared/config/hexd.yaml"
    owner: "{{ hexapod_user }}"
    group: "{{ hexapod_user }}"
    mode: "0644"
    force: false

# hexd powers the Pi off on critical battery (robot already seated). Only the
# power-off action is granted, only to the service user.
- name: Allow the service user to power off
  ansible.builtin.copy:
    dest: /etc/polkit-1/rules.d/50-hexapod-poweroff.rules
    content: |
      polkit.addRule(function (action, subject) {
        if (subject.user === "{{ hexapod_user }}" &&
            (action.id === "org.freedesktop.login1.power-off" ||
             action.id === "org.freedesktop.login1.power-off-multiple-sessions")) {
          return polkit.Result.YES;
        }
      });
    mode: "0644"
