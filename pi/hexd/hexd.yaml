# hexd configuration. Installed to /opt/hexapod/shared/config/hexd.yaml by
# pi/provision (only if missing: local edits on the Pi survive re-provisioning).
# Every key is optional; the values below are the defaults.

listen: ":8080"            # /ws, /health, /version, /metrics

serial:
  device: /dev/hexapod-esp32   # or tcp://127.0.0.1:7777 for hexsim
  baud: 115200                 # CP2102 of the bench board; ignored by the S3 USB
  silence_limit: 3s            # reopen the link if the ESP32 says nothing

deadman:
  wifi: 150ms                  # app silence before the zero-velocity command
  cellular: 400ms
  cellular_interfaces: [wwan, ppp]   # interface prefixes that mean 4G

health_max_age: 2s             # /health is 200 only if the ESP32 talked this recently

metrics:
  pi_temperature_path: /sys/class/thermal/thermal_zone0/temp
  wireless_path: /proc/net/wireless
  wifi_interface: wlan0

auth:
  required: true               # apps must pair (QR on the OLED); false only for development
  identity: /opt/hexapod/shared/config/identity.json   # id, name, key (created on first start)

wifi:                          # own network "Hexapode-<id>" + home networks set from the app
  enabled: true                # needs auth.required (the own network's password comes from the key)
  interface: wlan0
  settings: /opt/hexapod/shared/config/network.json   # mode: home or direct
  fallback_after: 45s          # no home network this long: open the own network
  own_band: auto               # own network: auto = 5 GHz when the chip has it (Pi 4), else 2.4; or 5 / 2.4

media:                         # camera: photos and recordings on the SD card, gallery in the app
  enabled: true
  dir: /opt/hexapod/shared/media
  source: rtsp://127.0.0.1:8554/cam   # MediaMTX (pi/mediamtx/mediamtx.yml), copied without re-encoding
  max_record: 30m              # a recording stops by itself after this long
  min_free_mb: 500             # keep this much of the card free (MB): no photo/recording below it
  api: http://127.0.0.1:9997   # MediaMTX API: camera quality 720p / 1080p
  settings: /opt/hexapod/shared/config/camera.json

tailscale:                     # remote access: the app logs the robot in (marco 3)
  enabled: true                # needs auth.required; hexd is the tailscale operator

gps:                           # NEO-6M on the Pi's UART (firmware/PINOUT.md)
  enabled: true                # without a GPS hexd only logs it and retries
  device: /dev/serial0
  baud: 9600
  simulate: false              # true: fake positions around sim_latitude/longitude (no module)
  sim_latitude: -23.5505
  sim_longitude: -46.6333

display:                       # SSD1306 OLED on the Pi's I2C (firmware/PINOUT.md)
  enabled: true                # without a panel hexd only logs it and retries
  bus: /dev/i2c-1
  address: 0x3c
  page_time: 5s                # each page (status, network, alert) stays this long
  wired_interface: eth0        # Wi-Fi is metrics.wifi_interface
  tailnet_interface: tailscale0

eye:                           # the cyclops eye: ST7789 1.54" on SPI0 (firmware/PINOUT.md, ADR-0015)
  enabled: true                # without the panel hexd only logs it and retries
  spi: /dev/spidev0.0
  spi_mode: 3                  # boards without a CS pin need mode 3
  spi_hz: 40000000             # the Pi rounds it down to what its SPI can do
  gpio_chip: /dev/gpiochip0
  dc: 25                       # BCM numbers (physical pins 22, 18, 12)
  reset: 24
  backlight: 18
  rotation: 0                  # 0/90/180/270: how the panel sits behind the window
  bgr: false                   # red and blue swapped on screen? set true
  fps: 15                      # still frames are skipped (a calm eye costs little)

vision:                        # follow me: targets from hexvision (pi/hexvision, ADR-0017)
  enabled: true                # without hexvision the app just sees no targets
  listen: 127.0.0.1:47300      # UDP, local only
  follow: false                # true: the robot walks after the locked target (walk mode,
                               # sticks at rest; a stick or STOP takes over). Test first!
  distance: 1.2                # m kept from the target
  max_speed: 0.5               # 0..1 of the walking speed
  max_turn: 0.6                # 0..1 of the turning speed

shutdown:
  enabled: true                # power off on LOW_BATTERY (robot already seated)
  delay: 10s                   # condition must hold this long
  command: [systemctl, poweroff]   # allowed by a polkit rule (pi/provision)
