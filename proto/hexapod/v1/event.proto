syntax = "proto3";

package hexapod.v1;

// Interaction events for the future "pet" mode.
enum EventType {
  EVENT_TYPE_UNSPECIFIED = 0;
  EVENT_TYPE_TOUCH = 1;
  EVENT_TYPE_PUSH = 2; // IMU detected an external push
  EVENT_TYPE_APPROACH = 3; // something approaching a distance sensor
}

message Event {
  EventType type = 1;
  uint32 timestamp_ms = 2; // ESP32 uptime
  uint32 sensor_index = 3; // distance sensor for APPROACH, otherwise 0
  float magnitude = 4; // type-specific: mm for APPROACH, m/s^2 for PUSH
}
