syntax = "proto3";

package hexapod.v1;

import "hexapod/v1/calibration.proto";
import "hexapod/v1/command.proto";
import "hexapod/v1/event.proto";
import "hexapod/v1/hello.proto";
import "hexapod/v1/telemetry.proto";

// Every serial frame and every WebSocket message carries exactly one Envelope.
// Field numbers are part of the wire contract: never reuse or renumber them.
message Envelope {
  oneof payload {
    Hello hello = 1;
    Command command = 2;
    Telemetry telemetry = 3;
    CalibrationCommand calibration_command = 4;
    CalibrationReport calibration_report = 5;
    Event event = 6;
    LinkConfig link_config = 7;
  }
}
